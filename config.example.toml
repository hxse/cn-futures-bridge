# 默认 SimNow；空账户保留登录界面。实盘按下方注释明确选择华安站点。
[bridge]
environment = "simnow" # simnow 或 live；修改后须重新创建容器。
data_dir = "/data"
startup_timeout_seconds = 90

[account]
# SimNow 留空时使用 9999 / 电信2；华安 live 必须填 6020 / 一套或二套。
broker_id = ""
site = ""
username = ""
password = ""

[api]
host = "0.0.0.0"
port = 45173

[desktop]
width = 1280
height = 800
dpi = 96

[vnc]
port = 45174
web_port = 45175

[execution]
queue_capacity = 32
queue_timeout_ms = 5000
step_timeout_ms = 3000
poll_interval_ms = 10
gui_action_gap_ms = 10
idempotency_ttl_hours = 168
journal_max_bytes = 134217728

[logging]
level = "INFO"
max_file_bytes = 20971520
max_total_bytes = 209715200

[artifacts]
max_total_bytes = 314572800
cleanup_interval_seconds = 60
min_free_bytes = 536870912
